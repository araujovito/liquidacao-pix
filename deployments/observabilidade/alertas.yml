groups:
  - name: liquidacao-pix
    rules:
      # Os limites críticos são os mesmos do resumo do Grafana. O `for`
      # elimina picos breves sem transformar tamanho da fila em sinal de saúde.
      - alert: PixOutboxAntiga
        expr: max(pix_outbox_mais_antiga_segundos) > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A publicação da outbox está atrasada
          description: A linha mais antiga espera há mais de 60 segundos; verifique o relay e o Redis.

      - alert: PixTransferenciaPendenteAntiga
        expr: max(pix_transferencia_pendente_mais_antiga_segundos) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Há transferência pendente antiga
          description: Uma transferência permanece pendente há mais de 120 segundos; localize o atraso entre outbox, stream e worker.

      - alert: PixConciliacaoAtrasada
        expr: time() - max(pix_conciliacao_ultima_execucao_timestamp_segundos) > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A conciliação deixou de concluir
          description: Nenhuma conciliação terminou nos últimos 300 segundos, mais de dois intervalos normais.

      - alert: PixEstadoColetaFalhando
        expr: min by (fonte) (pix_estado_coleta_sucesso) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A coleta de estado está falhando
          description: O conciliador não consegue consultar {{ $labels.fonte }}; os números dessa fonte ficam ausentes, não zerados.

      # --- Cegueira: o que as regras acima NÃO conseguem ver sozinhas ---------
      # As métricas de idade e de conciliação vêm do conciliador. Se ele cai,
      # as séries somem (o Prometheus as marca como obsoletas) e as regras
      # acima ficam em silêncio, sem nenhum alarme. Estas duas cobrem esse
      # buraco; sem elas, o pior dia do sistema seria também o de painel verde.
      # Dois jeitos de um programa "cair": ele ainda existe na lista de alvos e
      # não responde (up == 0, ex.: processo travado), ou ele SUMIU da lista
      # (contêiner parado: a descoberta por DNS o remove e a série up deixa de
      # existir, então up == 0 nunca acontece). O absent() cobre o segundo caso,
      # que é o mais comum e foi o que o teste contra o Prometheus real revelou.
      - alert: PixAlvoForaDoAr
        expr: |
          up{job=~"api|relay|worker|conciliador"} == 0
            or absent(up{job="api"})
            or absent(up{job="relay"})
            or absent(up{job="worker"})
            or absent(up{job="conciliador"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Um programa deixou de responder ao Prometheus
          description: "{{ $labels.job }} não responde ou sumiu da lista de alvos há mais de 1 minuto. Se for o conciliador, os alertas de idade da outbox e das pendentes ficam cegos até ele voltar."

      - alert: PixConciliacaoAusente
        expr: absent(pix_conciliacao_ultima_execucao_timestamp_segundos)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Não existe nenhuma conciliação concluída
          description: A série da última conciliação não existe há 5 minutos. O conciliador está fora do ar ou nunca conseguiu concluir uma conciliação.

