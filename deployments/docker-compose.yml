name: liquidacao-pix

services:
  postgres:
    image: postgres:17-alpine
    # log_checkpoints: um checkpoint grava todas as páginas sujas de uma vez e
    # pode parar escritas por instantes; o log permite relacionar pausas da
    # API com checkpoints (docs/carga.md).
    command: ["postgres", "-c", "log_checkpoints=on"]
    environment:
      POSTGRES_USER: pix
      POSTGRES_PASSWORD: pix # senha de desenvolvimento
      POSTGRES_DB: pix
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pix -d pix"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    # appendonly: sem isso, um reinício do Redis apaga o stream e as mensagens
    # ainda não confirmadas. A outbox no Postgres cobriria a perda, mas o
    # relay teria de republicar tudo; com AOF o Redis volta com o stream.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Os programas. `make sistema` sobe tudo; `make infra` só o banco e o Redis
  # (para rodar os programas fora do Docker durante o desenvolvimento).
  migrar:
    build: { context: .., dockerfile: deployments/Dockerfile }
    image: liquidacao-pix:dev
    command: ["/app/migrar"]
    environment: &ambiente
      DATABASE_URL: postgres://pix:pix@postgres:5432/pix?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Rastreamento: desligado (vazio) por padrão; `make observabilidade` o
      # liga apontando para o Jaeger. Sob carga pesada, baixe a razão (ex.:
      # OTEL_TRACES_SAMPLER_ARG=0.01): amostrar tudo tem custo.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [sistema]

  api:
    image: liquidacao-pix:dev
    command: ["/app/api"]
    environment: *ambiente
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on:
      migrar: { condition: service_completed_successfully }
    profiles: [sistema]

  relay:
    image: liquidacao-pix:dev
    command: ["/app/relay"]
    environment: *ambiente
    restart: unless-stopped
    depends_on:
      migrar: { condition: service_completed_successfully }
    profiles: [sistema]

  worker:
    image: liquidacao-pix:dev
    command: ["/app/worker"]
    environment:
      <<: *ambiente
      WORKERS: ${WORKERS:-32} # consumidores por processo; ver docs/carga.md
    restart: unless-stopped
    depends_on:
      migrar: { condition: service_completed_successfully }
    profiles: [sistema]

  # Conciliação periódica e estado da fila (outbox, idade, stream). Uma única
  # instância: o estado é lido na hora da coleta e réplicas o duplicariam.
  conciliador:
    image: liquidacao-pix:dev
    command: ["/app/conciliador"]
    environment: *ambiente
    restart: unless-stopped
    depends_on:
      migrar: { condition: service_completed_successfully }
    profiles: [sistema]

  # Observabilidade: `make observabilidade`. Os programas expõem /metrics na
  # porta 9100 só dentro da rede do Compose; daqui para fora só saem o
  # Prometheus (9090) e o Grafana (3001), ambos presos ao 127.0.0.1.
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    profiles: [observabilidade]

  # Traces: UI em http://localhost:16686 (serviços pix-api, pix-relay,
  # pix-worker). Armazenamento em memória: some ao reiniciar, de propósito.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      MEMORY_MAX_TRACES: "20000"
    ports: ["127.0.0.1:16686:16686"]
    restart: unless-stopped
    profiles: [observabilidade]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Painel só de leitura para qualquer um que chegue em localhost; o admin
      # (admin/admin) é de desenvolvimento.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/paineis:/var/lib/grafana/paineis:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, jaeger]
    restart: unless-stopped
    profiles: [observabilidade]

volumes:
  postgres:
  redis:
